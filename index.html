<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Manhua Tracker</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" href="icon-192.png" />
  <meta name="theme-color" content="#121214" />
  <style>
    :root {
      --bg: #121214;
      --card: #202024;
      --card-border: #323238;
      --primary: #8257e6;
      --primary-hover: #9466ff;
      --text: #e1e1e6;
      --muted: #a8a8b3;
      --danger: #e57878;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); min-height: 100vh; }
    .container { max-width: 650px; margin: 0 auto; padding: 16px; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    h1 { font-size: 1.4rem; }
    
    .view { display: none; }
    .view.active { display: block; }

    /* Cards e Formulário */
    .card { background: var(--card); border: 1px solid var(--card-border); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
    label { font-size: 0.85rem; color: var(--muted); margin-bottom: 4px; display: block; }
    input { width: 100%; padding: 12px; background: #18181b; border: 1px solid var(--card-border); border-radius: 8px; color: #fff; margin-bottom: 12px; font-size: 1rem; }
    input:focus { outline: none; border-color: var(--primary); }
    
    .btn { background: var(--primary); color: #fff; border: none; padding: 12px; border-radius: 8px; font-weight: 600; cursor: pointer; text-align: center; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
    .btn:hover { background: var(--primary-hover); }
    .btn:active { opacity: 0.85; }
    .btn-secondary { background: #29292e; color: #fff; }
    .btn-secondary:hover { background: #3a3a42; }
    .btn-danger { background: transparent; color: var(--danger); border: 1px solid var(--danger); }
    .btn-danger:hover { background: rgba(229, 120, 120, 0.1); }
    .btn-sm { padding: 8px 12px; font-size: 0.9rem; }
    .w-full { width: 100%; }

    /* Lista de Obras */
    .manhua-item { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; margin-bottom: 12px; gap: 12px; transition: border-color 0.2s; }
    .manhua-item:hover { border-color: var(--primary); }
    .manhua-info { flex: 1; cursor: pointer; text-decoration: none; color: inherit; display: block; }
    .manhua-info:hover h3 { color: var(--primary-hover); }
    .badge { background: #29292e; color: #a8a8b3; padding: 4px 8px; border-radius: 6px; font-size: 0.8rem; display: inline-block; margin-top: 4px; }
    
    .item-actions { display: flex; align-items: center; gap: 8px; }
    .action-btn { background: #29292e; border: 1px solid var(--card-border); color: #fff; border-radius: 8px; width: 38px; height: 38px; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; font-size: 1.1rem; transition: background 0.2s, border-color 0.2s; text-decoration: none; }
    .action-btn:hover { background: #3a3a42; border-color: var(--primary); }

    /* Favoritos e Reordenação */
    .star-btn {
      background: none;
      border: none;
      font-size: 1.4rem;
      cursor: pointer;
      padding: 0 4px;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s, color 0.2s;
    }
    .star-btn:hover { transform: scale(1.25); }
    .star-btn.active { color: #f59e0b; text-shadow: 0 0 8px rgba(245, 158, 11, 0.4); }
    .star-btn.inactive { color: #52525b; }
    .star-btn.inactive:hover { color: #e4e4e7; }

    .section-header {
      font-size: 0.9rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      margin: 22px 0 10px 4px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .section-header span {
      background: #29292e;
      color: #fff;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .move-banner {
      background: rgba(130, 87, 230, 0.12);
      border: 1px solid var(--primary);
      border-radius: 10px;
      padding: 12px 16px;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      animation: fadeIn 0.2s ease-in-out;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }

    .card.moving-selected {
      border-color: var(--primary) !important;
      box-shadow: 0 0 18px rgba(130, 87, 230, 0.45);
      background: #272238;
    }

    .move-slot {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 6px 0;
      animation: fadeIn 0.2s ease-in-out;
    }
    .move-slot-btn {
      background: #18181b;
      border: 1px dashed var(--primary);
      color: var(--text);
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .move-slot-btn:hover {
      background: var(--primary);
      color: #fff;
      border-style: solid;
      transform: scale(1.05);
      box-shadow: 0 4px 12px rgba(130, 87, 230, 0.4);
    }

    /* Tela de Detalhes / Leitura */
    .detail-header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
    .nav-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 16px 0; }
    .chapter-selector { display: flex; gap: 8px; margin-top: 12px; }
    .chapter-selector input { margin-bottom: 0; text-align: center; font-size: 1.1rem; }

    /* Tela de Leitura Contínua Nativa (Webtoon/Manhua) */
    #readerView { width: 100%; min-height: 100vh; display: none; flex-direction: column; background: #0a0a0c; }
    #readerView.active { display: flex; }
    .reader-toolbar { position: sticky; top: 0; height: 54px; background: rgba(24, 24, 27, 0.95); backdrop-filter: blur(8px); border-bottom: 1px solid var(--card-border); display: flex; align-items: center; justify-content: space-between; padding: 0 12px; gap: 8px; z-index: 100; }
    .reader-title-area { flex: 1; text-align: center; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; padding: 0 8px; }
    .reader-title-area h3 { font-size: 0.95rem; font-weight: 600; overflow: hidden; text-overflow: ellipsis; color: #fff; }
    .reader-title-area span { font-size: 0.75rem; color: var(--primary-hover); }
    .reader-actions { display: flex; align-items: center; gap: 6px; }
    
    .reader-scroll-area { width: 100%; flex: 1; display: flex; flex-direction: column; align-items: center; }
    #readerImagesContainer { width: 100%; display: flex; flex-direction: column; align-items: center; }
    .chapter-page-img { max-width: 800px; width: 100%; display: block; margin: 0 auto; height: auto; background: #121214; }
    
    .reader-status-msg { text-align: center; padding: 60px 20px; color: var(--muted); font-size: 1rem; width: 100%; max-width: 500px; margin: 0 auto; }
    .reader-spinner { width: 36px; height: 36px; border: 3px solid rgba(130, 87, 230, 0.2); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .reader-footer { width: 100%; max-width: 800px; margin: 30px auto 60px; padding: 20px 16px; text-align: center; }
    .reader-footer-nav { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }

    /* Modal de Edição */
    .modal-backdrop { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.75); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 16px; }
    .modal-backdrop.active { display: flex; }
    .modal-box { background: var(--card); border: 1px solid var(--card-border); border-radius: 12px; width: 100%; max-width: 480px; padding: 20px; box-shadow: 0 8px 32px rgba(0,0,0,0.5); }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .modal-header h2 { font-size: 1.2rem; }
    .modal-actions { display: flex; gap: 10px; margin-top: 16px; }
  </style>
</head>
<body>

  <!-- TELA 1: LISTA DE MANHUAS -->
  <div id="listView" class="view active">
    <div class="container">
      <header>
        <h1>Meus Manhuas</h1>
        <button class="btn btn-secondary" onclick="toggleForm()">+ Novo</button>
      </header>

      <!-- Formulário de Cadastro (Recolhível) -->
      <div id="formSection" class="card" style="display: none;">
        <label>Nome do Manhua</label>
        <input type="text" id="title" placeholder="Ex: Overgeared" />
        <label>URL do Capítulo Atual</label>
        <input type="url" id="rawUrl" placeholder="https://exemplo.com/manga/chapter-197/" />
        <label>Capítulo Atual</label>
        <input type="number" id="chapter" placeholder="197" />
        <button class="btn w-full" onclick="saveNewManhua()">Cadastrar</button>
      </div>

      <div id="manhuaList"></div>
    </div>
  </div>

  <!-- TELA 2: GERENCIAMENTO E DETALHES -->
  <div id="detailView" class="view">
    <div class="container">
      <div class="detail-header">
        <button class="btn btn-secondary btn-sm" onclick="showListView()">← Voltar</button>
        <h2 id="detailTitle" style="font-size: 1.15rem; flex: 1; text-overflow: ellipsis; overflow: hidden; white-space: nowrap;"></h2>
        <button class="action-btn" title="Editar Obra" onclick="openEditModal(selectedManhua.id)">✏️</button>
      </div>

      <div class="card" style="text-align: center;">
        <p style="color: var(--muted); font-size: 0.9rem;">Capítulo Atual</p>
        <h1 id="detailChapter" style="font-size: 3rem; margin: 8px 0; color: var(--primary);"></h1>

        <!-- Botões de Leitura -->
        <button class="btn w-full" style="padding: 14px; font-size: 1.05rem; margin-bottom: 8px;" onclick="openReader(selectedManhua.id)">
          📖 Ler no Leitor Nativo
        </button>
        <a id="btnExternalRead" class="btn btn-secondary w-full btn-sm" style="margin-bottom: 16px;" target="_blank">
          ↗ Abrir no Site Original
        </a>

        <!-- Controles de Avançar / Voltar -->
        <div class="nav-buttons">
          <button class="btn btn-secondary" onclick="changeSelectedChapter(-1)">◀ Anterior</button>
          <button class="btn btn-secondary" onclick="changeSelectedChapter(1)">Próximo ▶</button>
        </div>

        <hr style="border: 0; border-top: 1px solid var(--card-border); margin: 16px 0;" />

        <!-- Seleção Direta de Capítulo -->
        <label>Ir diretamente para o capítulo:</label>
        <div class="chapter-selector">
          <input type="number" id="manualChapterInput" placeholder="Nº" />
          <button class="btn btn-secondary" onclick="setManualChapter()">Definir</button>
        </div>
      </div>

      <button class="btn btn-danger w-full" onclick="deleteCurrentManhua()">Remover Obra da Lista</button>
    </div>
  </div>

  <!-- TELA 3: LEITOR NATIVO CONTÍNUO (WEBTOON / MANHUA) -->
  <div id="readerView" class="view">
    <div class="reader-toolbar">
      <button class="btn btn-secondary btn-sm" onclick="closeReader()">← Voltar</button>
      
      <div class="reader-title-area">
        <h3 id="readerTitle"></h3>
        <span id="readerSubtitle"></span>
      </div>

      <div class="reader-actions">
        <button class="btn btn-secondary btn-sm" onclick="changeReaderChapter(-1)" title="Capítulo Anterior">◀</button>
        <button class="btn btn-secondary btn-sm" onclick="changeReaderChapter(1)" title="Próximo Capítulo">▶</button>
        <a id="btnReaderExternal" class="action-btn" target="_blank" title="Abrir página original no navegador">↗</a>
      </div>
    </div>

    <div class="reader-scroll-area">
      <div id="readerLoading" class="reader-status-msg">
        <div class="reader-spinner"></div>
        <p>Extraindo páginas do capítulo...</p>
      </div>

      <div id="readerError" class="reader-status-msg" style="display: none;"></div>

      <div id="readerImagesContainer"></div>

      <div id="readerFooter" class="reader-footer" style="display: none;">
        <p style="color: var(--muted); font-size: 0.9rem;">Fim do capítulo</p>
        <div class="reader-footer-nav">
          <button class="btn btn-secondary" onclick="changeReaderChapter(-1)">◀ Anterior</button>
          <button class="btn" onclick="changeReaderChapter(1)">Próximo Capítulo ▶</button>
        </div>
      </div>
    </div>
  </div>

  <!-- MODAL DE EDIÇÃO -->
  <div id="editModal" class="modal-backdrop">
    <div class="modal-box">
      <div class="modal-header">
        <h2>Editar Obra</h2>
        <button class="action-btn" onclick="closeEditModal()">✕</button>
      </div>

      <input type="hidden" id="editId" />
      <label>Nome do Manhua</label>
      <input type="text" id="editTitle" placeholder="Ex: Overgeared" />
      
      <label>URL Atual ou Template (com {chapter})</label>
      <input type="url" id="editUrl" placeholder="https://exemplo.com/manga/chapter-{chapter}/" />
      
      <label>Capítulo Atual</label>
      <input type="number" id="editChapter" placeholder="197" />

      <div class="modal-actions">
        <button class="btn btn-secondary w-full" onclick="closeEditModal()">Cancelar</button>
        <button class="btn w-full" onclick="saveEditManhua()">Salvar Alterações</button>
      </div>
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(console.error);
    }

    let manhuas = [];
    let selectedManhua = null;
    let readerManhua = null;
    let previousView = 'listView';
    let movingItem = null;

    function escapeHtml(text) {
      if (!text) return '';
      return String(text)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    async function loadData() {
      try {
        const res = await fetch('/api/manhuas');
        manhuas = await res.json();
        renderList();

        if (selectedManhua) {
          selectedManhua = manhuas.find(m => m.id === selectedManhua.id) || null;
          if (selectedManhua) renderDetails();
          else showListView();
        }

        if (readerManhua) {
          readerManhua = manhuas.find(m => m.id === readerManhua.id) || null;
          if (readerManhua) updateReaderHeader();
        }
      } catch (e) {
        console.error('Erro ao carregar dados:', e);
      }
    }

    async function toggleFavorite(id, event) {
      if (event) event.stopPropagation();
      const item = manhuas.find(m => m.id === id);
      if (!item) return;
      const newFav = !item.isFavorite;
      try {
        await fetch(`/api/manhuas/${id}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ isFavorite: newFav })
        });
        await loadData();
      } catch (err) {
        console.error('Erro ao alternar favorito:', err);
      }
    }

    function startMoveItem(id, event) {
      if (event) event.stopPropagation();
      movingItem = manhuas.find(m => m.id === id) || null;
      renderList();
    }

    function cancelMove() {
      movingItem = null;
      renderList();
    }

    async function moveItemTo(isFavGroup, targetIndex) {
      if (!movingItem) return;
      const isFav = Boolean(movingItem.isFavorite);
      const favorites = manhuas.filter(m => Boolean(m.isFavorite));
      const others = manhuas.filter(m => !m.isFavorite);

      const group = isFav ? [...favorites] : [...others];
      const curIdx = group.findIndex(m => m.id === movingItem.id);
      if (curIdx !== -1) {
        group.splice(curIdx, 1);
      }

      const adjustedTarget = targetIndex > curIdx ? targetIndex - 1 : targetIndex;
      group.splice(adjustedTarget, 0, movingItem);

      const newFavorites = isFav ? group : favorites;
      const newOthers = isFav ? others : group;
      const fullList = [...newFavorites, ...newOthers];
      const orderedIds = fullList.map(m => m.id);

      try {
        await fetch('/api/manhuas/reorder', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ order: orderedIds })
        });
        movingItem = null;
        await loadData();
      } catch (err) {
        console.error('Erro ao salvar reordenação:', err);
      }
    }

    function renderList() {
      const listEl = document.getElementById('manhuaList');
      if (!manhuas.length) {
        listEl.innerHTML = '<p style="text-align: center; color: var(--muted); margin-top: 40px;">Nenhum manhua salvo ainda.</p>';
        return;
      }

      const favorites = manhuas.filter(m => Boolean(m.isFavorite));
      const others = manhuas.filter(m => !m.isFavorite);

      let html = '';

      if (movingItem) {
        html += `
          <div class="move-banner">
            <div>
              <strong>↕ Movendo: ${escapeHtml(movingItem.title)}</strong>
              <div style="font-size: 0.85rem; color: var(--muted); margin-top: 2px;">
                Selecione um marcador <em>"Mover para cá"</em> para definir a nova posição.
              </div>
            </div>
            <button class="btn btn-secondary btn-sm" onclick="cancelMove()">✕ Cancelar (Esc)</button>
          </div>
        `;
      }

      const renderCard = (m) => {
        const isSelected = movingItem && movingItem.id === m.id;
        return `
          <div class="card manhua-item ${isSelected ? 'moving-selected' : ''}">
            <button class="star-btn ${m.isFavorite ? 'active' : 'inactive'}" onclick="toggleFavorite(${m.id}, event)" title="${m.isFavorite ? 'Remover dos favoritos' : 'Favoritar obra'}">
              ${m.isFavorite ? '★' : '☆'}
            </button>
            <div class="manhua-info" onclick="openReader(${m.id}, event)" title="Clique para ler o capítulo atual">
              <h3 style="font-size: 1.05rem; font-weight: 600;">${escapeHtml(m.title)}</h3>
              <span class="badge">Capítulo ${m.currentChapter} • Ler agora 📖</span>
            </div>
            <div class="item-actions">
              <button class="action-btn" title="Mover posição" onclick="startMoveItem(${m.id}, event)">↕</button>
              <button class="action-btn" title="Visualizar e Gerenciar" onclick="selectManhua(${m.id}, event)">👁️</button>
              <button class="action-btn" title="Editar Obra" onclick="openEditModal(${m.id}, event)">✏️</button>
            </div>
          </div>
        `;
      };

      const renderSection = (title, items, isFavGroup) => {
        let secHtml = '';
        if (favorites.length > 0) {
          secHtml += `<div class="section-header">${title} <span>${items.length}</span></div>`;
        }

        const showSlots = movingItem && Boolean(movingItem.isFavorite) === isFavGroup;

        if (showSlots) {
          const curIdx = items.findIndex(m => m.id === movingItem.id);
          if (curIdx > 0) {
            secHtml += `<div class="move-slot"><button class="move-slot-btn" onclick="moveItemTo(${isFavGroup}, 0)">⬆ Mover para o topo</button></div>`;
          }
          items.forEach((m, idx) => {
            secHtml += renderCard(m);
            if (idx !== curIdx && idx !== curIdx - 1) {
              const targetIdx = idx + 1;
              secHtml += `<div class="move-slot"><button class="move-slot-btn" onclick="moveItemTo(${isFavGroup}, ${targetIdx})">↕ Mover para cá</button></div>`;
            }
          });
        } else {
          items.forEach(m => {
            secHtml += renderCard(m);
          });
        }
        return secHtml;
      };

      if (favorites.length > 0) {
        html += renderSection('★ Obras Favoritas', favorites, true);
      }
      if (others.length > 0) {
        const title = favorites.length > 0 ? 'Todas as Obras' : 'Meus Manhuas';
        html += renderSection(title, others, false);
      }

      listEl.innerHTML = html;
    }

    function toggleForm() {
      const form = document.getElementById('formSection');
      form.style.display = form.style.display === 'none' ? 'block' : 'none';
    }

    async function saveNewManhua() {
      const title = document.getElementById('title').value.trim();
      const rawUrl = document.getElementById('rawUrl').value.trim();
      const chapter = parseInt(document.getElementById('chapter').value, 10);

      if (!title || !rawUrl || isNaN(chapter)) return alert('Preencha todos os campos!');

      let urlTemplate = rawUrl;
      if (!urlTemplate.includes('{chapter}')) {
        if (/mangafire\.to/i.test(rawUrl)) {
          urlTemplate = rawUrl.replace(/\/chapter\/\d+/, '/chapter/{chapter}');
        } else if (/comix\.to/i.test(rawUrl)) {
          urlTemplate = rawUrl.replace(/\/\d+-chapter-\d+/, '/{chapter}');
        } else {
          const regex = new RegExp(`(?<=[^0-9]|^)${chapter}(?=[^0-9]|$)`);
          if (!regex.test(rawUrl)) return alert('O número do capítulo não foi localizado na URL.');
          urlTemplate = rawUrl.replace(regex, '{chapter}');
        }
      }

      await fetch('/api/manhuas', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title, urlTemplate, currentChapter: chapter })
      });

      toggleForm();
      document.getElementById('title').value = '';
      document.getElementById('rawUrl').value = '';
      document.getElementById('chapter').value = '';
      loadData();
    }

    function selectManhua(id, event) {
      if (event) event.stopPropagation();
      selectedManhua = manhuas.find(m => m.id === id);
      renderDetails();
      switchView('detailView');
    }

    function showListView() {
      selectedManhua = null;
      document.title = 'Manhua Tracker';
      switchView('listView');
      loadData();
    }

    function switchView(viewId) {
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      const target = document.getElementById(viewId);
      if (target) target.classList.add('active');
    }

    function resolveTargetUrl(manhua) {
      if (!manhua) return '';
      if (manhua.urlTemplate.includes('comix.to') && manhua.chapterId) {
        if (manhua.urlTemplate.includes('{chapter}')) {
          return manhua.urlTemplate.replace('{chapter}', `${manhua.chapterId}-chapter-${manhua.currentChapter}`);
        }
        return manhua.urlTemplate.replace(/\/\d+-chapter-\d+/, `/${manhua.chapterId}-chapter-${manhua.currentChapter}`);
      }
      if (manhua.urlTemplate.includes('mangafire.to') && manhua.chapterId) {
        return manhua.urlTemplate.includes('{chapter}')
          ? manhua.urlTemplate.replace('{chapter}', manhua.chapterId)
          : manhua.urlTemplate.replace(/\/chapter\/\d+/, `/chapter/${manhua.chapterId}`);
      }
      return manhua.urlTemplate.replace('{chapter}', manhua.currentChapter);
    }

    function renderDetails() {
      if (!selectedManhua) return;
      document.title = `${selectedManhua.title} ${selectedManhua.currentChapter}`;
      document.getElementById('detailTitle').innerText = selectedManhua.title;
      document.getElementById('detailChapter').innerText = selectedManhua.currentChapter;
      const targetUrl = resolveTargetUrl(selectedManhua);
      
      const btnExt = document.getElementById('btnExternalRead');
      btnExt.href = targetUrl;
      document.getElementById('manualChapterInput').value = selectedManhua.currentChapter;
    }

    async function changeSelectedChapter(delta) {
      if (!selectedManhua) return;
      const res = await fetch(`/api/manhuas/${selectedManhua.id}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ delta })
      });
      const data = await res.json();
      selectedManhua = data.item;
      renderDetails();
    }

    async function setManualChapter() {
      if (!selectedManhua) return;
      const input = document.getElementById('manualChapterInput');
      const val = parseInt(input.value, 10);
      if (isNaN(val) || val < 1) return;

      const res = await fetch(`/api/manhuas/${selectedManhua.id}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ chapter: val })
      });
      const data = await res.json();
      selectedManhua = data.item;
      renderDetails();
    }

    async function deleteCurrentManhua() {
      if (!selectedManhua) return;
      if (!confirm(`Remover "${selectedManhua.title}" da sua lista?`)) return;
      await fetch(`/api/manhuas/${selectedManhua.id}`, { method: 'DELETE' });
      showListView();
    }

    /* LEITOR NATIVO CONTÍNUO (WEBTOON / MANHUA) */
    function openReader(id, event) {
      if (event) event.stopPropagation();
      readerManhua = manhuas.find(m => m.id === id);
      if (!readerManhua) return;

      const activeView = document.querySelector('.view.active');
      if (activeView && activeView.id !== 'readerView') {
        previousView = activeView.id;
      }

      switchView('readerView');
      loadChapterPages();
    }

    function updateReaderHeader() {
      if (!readerManhua) return;
      document.title = `${readerManhua.title} ${readerManhua.currentChapter}`;
      const url = resolveTargetUrl(readerManhua);
      document.getElementById('readerTitle').innerText = readerManhua.title;
      document.getElementById('readerSubtitle').innerText = `Capítulo ${readerManhua.currentChapter}`;
      document.getElementById('btnReaderExternal').href = url;
    }

    async function loadChapterPages() {
      if (!readerManhua) return;
      updateReaderHeader();
      window.scrollTo({ top: 0, behavior: 'smooth' });

      const container = document.getElementById('readerImagesContainer');
      const loading = document.getElementById('readerLoading');
      const errorEl = document.getElementById('readerError');
      const footer = document.getElementById('readerFooter');

      container.innerHTML = '';
      loading.style.display = 'block';
      errorEl.style.display = 'none';
      footer.style.display = 'none';

      const targetUrl = resolveTargetUrl(readerManhua);

      try {
        const res = await fetch(`/api/chapter-images?url=${encodeURIComponent(targetUrl)}`);
        const data = await res.json();

        loading.style.display = 'none';

        if ((data.status === 'ok' || Array.isArray(data.images)) && data.images && data.images.length > 0) {
          if (data.chapter) readerManhua.currentChapter = data.chapter;
          if (data.chapterId) readerManhua.chapterId = data.chapterId;
          if (data.next) readerManhua.nextChapter = data.next;
          if (data.prev) readerManhua.prevChapter = data.prev;
          updateReaderHeader();

          container.innerHTML = data.images.map((imgUrl, idx) => `
            <img 
              src="/api/proxy-image?url=${encodeURIComponent(imgUrl)}" 
              loading="lazy" 
              class="chapter-page-img" 
              alt="Página ${idx + 1}"
            />
          `).join('');
          footer.style.display = 'block';
        } else {
          errorEl.style.display = 'block';
          errorEl.innerHTML = `
            <p style="margin-bottom: 12px;">Não foi possível extrair as páginas deste capítulo automaticamente.</p>
            <a href="${targetUrl}" target="_blank" class="btn btn-secondary">Abrir no Site Original ↗</a>
          `;
        }
      } catch (err) {
        loading.style.display = 'none';
        errorEl.style.display = 'block';
        errorEl.innerHTML = `
          <p style="margin-bottom: 12px; color: var(--danger);">Erro de conexão ao carregar páginas.</p>
          <a href="${targetUrl}" target="_blank" class="btn btn-secondary">Abrir no Site Original ↗</a>
        `;
      }
    }

    async function changeReaderChapter(delta) {
      if (!readerManhua) return;
      const res = await fetch(`/api/manhuas/${readerManhua.id}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ delta })
      });
      const data = await res.json();
      readerManhua = data.item;
      loadChapterPages();
    }

    function closeReader() {
      document.getElementById('readerImagesContainer').innerHTML = '';
      if (previousView === 'detailView' && selectedManhua) {
        document.title = `${selectedManhua.title} ${selectedManhua.currentChapter}`;
      } else {
        document.title = 'Manhua Tracker';
      }
      switchView(previousView || 'listView');
      loadData();
    }

    /* MODAL DE EDIÇÃO */
    function openEditModal(id, event) {
      if (event) event.stopPropagation();
      const item = manhuas.find(m => m.id === id);
      if (!item) return;

      document.getElementById('editId').value = item.id;
      document.getElementById('editTitle').value = item.title;
      document.getElementById('editUrl').value = item.urlTemplate;
      document.getElementById('editChapter').value = item.currentChapter;

      document.getElementById('editModal').classList.add('active');
    }

    function closeEditModal() {
      document.getElementById('editModal').classList.remove('active');
    }

    async function saveEditManhua() {
      const id = parseInt(document.getElementById('editId').value, 10);
      const title = document.getElementById('editTitle').value.trim();
      const rawUrl = document.getElementById('editUrl').value.trim();
      const chapter = parseInt(document.getElementById('editChapter').value, 10);

      if (!title || !rawUrl || isNaN(chapter)) {
        return alert('Preencha todos os campos corretamente!');
      }

      let urlTemplate = rawUrl;
      if (!urlTemplate.includes('{chapter}')) {
        if (/mangafire\.to/i.test(rawUrl)) {
          urlTemplate = rawUrl.replace(/\/chapter\/\d+/, '/chapter/{chapter}');
        } else if (/comix\.to/i.test(rawUrl)) {
          urlTemplate = rawUrl.replace(/\/\d+-chapter-\d+/, '/{chapter}');
        } else {
          const regex = new RegExp(`(?<=[^0-9]|^)${chapter}(?=[^0-9]|$)`);
          if (!regex.test(rawUrl)) {
            return alert('O número do capítulo não foi localizado na URL informada para gerar o template.');
          }
          urlTemplate = rawUrl.replace(regex, '{chapter}');
        }
      }

      await fetch(`/api/manhuas/${id}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          title,
          urlTemplate,
          chapter
        })
      });

      closeEditModal();
      loadData();
    }

    // Teclas de navegação e cancelamento
    window.addEventListener('keydown', (e) => {
      if (['INPUT', 'TEXTAREA', 'SELECT'].includes(e.target.tagName)) return;

      if (e.key === 'Escape') {
        if (movingItem) {
          cancelMove();
          return;
        }
        if (document.getElementById('editModal').classList.contains('active')) {
          closeEditModal();
          return;
        }
      }

      if (document.getElementById('editModal').classList.contains('active')) return;

      if (e.key === 'ArrowRight') {
        if (document.getElementById('readerView').classList.contains('active')) {
          e.preventDefault();
          changeReaderChapter(1);
        } else if (document.getElementById('detailView').classList.contains('active')) {
          e.preventDefault();
          changeSelectedChapter(1);
        }
      } else if (e.key === 'ArrowLeft') {
        if (document.getElementById('readerView').classList.contains('active')) {
          e.preventDefault();
          changeReaderChapter(-1);
        } else if (document.getElementById('detailView').classList.contains('active')) {
          e.preventDefault();
          changeSelectedChapter(-1);
        }
      }
    });

    loadData();
  </script>
</body>
</html>
